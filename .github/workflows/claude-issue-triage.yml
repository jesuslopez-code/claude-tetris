name: Claude Issue Triage

on:
  issues:
    types: [opened, edited]

# Si el issue se edita varias veces seguidas, cancelamos el analisis en curso
# y nos quedamos solo con el ultimo.
concurrency:
  group: issue-triage-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  triage:
    # No analizamos issues cerrados ni ediciones hechas por bots (el diagnostico
    # se publica como comentario, nunca editando el cuerpo, asi que no hay bucle).
    if: |
      github.event.issue.state == 'open' &&
      github.event.sender.type != 'Bot'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write # necesario para asignar labels y comentar
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Triaje del issue con Claude
        id: triage
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: '--allowed-tools "Read,Grep,Glob,Bash(gh issue view:*),Bash(gh issue edit:*),Bash(gh issue comment:*),Bash(gh label list:*),Bash(mkdir:*),Write"'
          prompt: |
            Eres el responsable de triaje de issues del repositorio ${{ github.repository }},
            un juego de Tetris en HTML/CSS/JavaScript sin dependencias ni build step.

            Tu tarea es analizar el issue #${{ github.event.issue.number }}: asignarle los
            labels adecuados y publicar un diagnostico tecnico que servira despues para
            implementar la solucion. NO escribas ni modifiques codigo del juego.

            ## Paso 1 - Leer el issue

            Ejecuta: gh issue view ${{ github.event.issue.number }} --json title,body,labels,author

            ## Paso 2 - Ver los labels disponibles

            Ejecuta: gh label list --limit 50

            Elige SOLO entre los labels que existen. No inventes labels nuevos.

            ## Paso 3 - Investigar el codigo

            Explora el repositorio para entender que parte esta implicada:
            - `game.js` es el nucleo del juego: matriz del tablero, definicion de las 7
              piezas, `collide`, `tryRotate` (con wall kicks), el bucle de
              `requestAnimationFrame`, `clearLines`, la puntuacion y la ghost piece.
            - `index.html` contiene el `<canvas id="board">` de 300x600, el panel lateral
              (score, lines, level, next) y el overlay de pausa/game over.
            - `style.css` contiene el tema retro oscuro.
            - `README.md` documenta controles, puntuacion y constantes ajustables.
            - `.github/workflows/` contiene los workflows de Claude.

            Usa Read/Grep/Glob para localizar las funciones y lineas concretas relevantes.
            Cita numeros de linea reales, no inventados.

            ## Paso 4 - Asignar labels

            Ejecuta `gh issue edit ${{ github.event.issue.number }} --add-label "..."`
            (puedes pasar varios separados por coma) siguiendo estas reglas:

            - Exactamente UN label de tipo: `bug`, `enhancement`, `documentation` o `question`.
            - Uno o mas labels de area: `area:gameplay`, `area:rendering`, `area:ui`,
              `area:controls`, `area:scoring`, `area:docs`, `area:ci`.
            - Exactamente UNA prioridad:
              - `priority:high` si bloquea el juego o lo hace injugable,
              - `priority:medium` si molesta pero tiene workaround,
              - `priority:low` si es cosmetico o una mejora menor.
            - `needs-info` si el issue no aporta pasos de reproduccion ni contexto
              suficiente para diagnosticarlo.
            - `good first issue` si el arreglo son pocas lineas en un solo archivo.
            - `invalid` si el issue es spam o ininteligible.
            - Siempre `triaged` al terminar.

            No quites labels que ya tuviera el issue.

            ## Paso 5 - Publicar el diagnostico

            Escribe el diagnostico en un archivo temporal (por ejemplo
            `/tmp/diagnostico.md`) con la herramienta Write y publicalo con:

            gh issue comment ${{ github.event.issue.number }} --body-file /tmp/diagnostico.md

            El comentario debe ser MARKDOWN VALIDO que GitHub entienda, ir en ESPANOL,
            y ser CONCISO (máx 500 palabras). Estructura:

            ```markdown
            ## 🔍 Diagnóstico

            **Resumen:** <1-2 frases>

            **Tipo:** Bug | Mejora | Documentación | Pregunta

            **Ubicación:** game.js:<línea> / index.html:<línea> / etc

            **Causa raíz:** <1 párrafo máximo: qué está roto o qué falta>

            **Solución:** <3-5 pasos concretos, numerados>

            **Riesgos:** <1 línea si aplica>

            ---
            *Análisis automático. Para implementar, menciona `@claude`.*
            ```

            ## Reglas

            - No modifiques codigo, no crees ramas, no abras pull requests.
            - No cierres el issue ni respondas a otros comentarios.
            - Se concreto y tecnico: el objetivo es que quien implemente la solucion
              (persona o Claude) pueda empezar directamente desde tu diagnostico.
            - Si el issue es una pregunta y no un bug, responde a la pregunta dentro
              de la seccion "Análisis" en lugar de inventar una causa raiz.
